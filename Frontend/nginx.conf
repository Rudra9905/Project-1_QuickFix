server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy /api requests to backend if we want to avoid CORS issues or hide backend URL
    # But usually redundant if we have CORS set up. 
    # Leaving it here commented out or active based on preference.
    # location /api {
    #     proxy_pass http://backend:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
