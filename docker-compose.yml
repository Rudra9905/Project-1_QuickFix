services:
  # ============================================
  # Application Services
  # ============================================

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: quickfix-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      # Docker-network overrides
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      jpa.ddl-auto: update
      TZ: Asia/Kolkata
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_STRIPE_PUBLISHABLE_KEY: pk_test_51SocKR2L2z49R0xuMG9KRntbiO2HXQEj1kh5KEm8hWO3v7XoP43d3bhHo4ssEmALlAOJQPzW5Rmoz4WCPxr2X7sl00Aa30uX1d
    container_name: quickfix-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  uploads_data:
